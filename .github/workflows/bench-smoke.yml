name: Benchmark smoke

# Opt-in, non-blocking benchmark build/run smoke (#1099). Builds and runs ONE
# tiny benchmark through the #1097 harness on Linux and asserts the TypeLisp and
# C binaries agree on observable output. This is a correctness smoke, NOT a
# performance gate — wall-clock timing is too noisy to block CI on (#929) — so it
# lives in this separate manual/nightly workflow instead of the required CI
# checks.

on:
  workflow_dispatch:
  schedule:
    # Nightly, low-traffic hour. Scheduled runs only fire on the default branch.
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  bench-smoke:
    name: Benchmark smoke (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Verify native toolchain
        run: |
          command -v as
          command -v ld
          command -v clang

      - name: Build compiler
        run: cargo build --release

      - name: Benchmark build/run smoke
        # `--smoke` builds + runs a single small benchmark (arith_loop by
        # default) and checks TypeLisp vs C agree on observable output; it skips
        # all timing, so it is fast and free of perf flake.
        run: TYPELISP_BIN=target/release/typelisp bash scripts/bench.sh --smoke
