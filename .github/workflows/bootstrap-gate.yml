name: Bootstrap Gate

# Two-stage bootstrap gate: download the latest stage0 compiler, use it to
# compile the selfhost compiler (stage1), then use stage1 to compile the same
# source (stage2), and verify stage1/stage2 produce identical .s output.
#
# This proves the selfhost compiler can compile itself.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  bootstrap-linux:
    name: Bootstrap Gate (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest stage0
        run: |
          mkdir -p stage0
          curl -fsSL -o stage0/typelisp \
            "https://github.com/${{ github.repository }}/releases/download/stage0-latest/typelisp-stage0-linux"
          chmod +x stage0/typelisp
          ./stage0/typelisp --version 2>&1 || true
          file ./stage0/typelisp

      - name: Stage1 — stage0 compiles selfhost
        run: |
          echo "=== Stage0 → Stage1 ==="
          # Once #513 (selfhost import resolution) lands:
          # mkdir -p bootstrap/stage1
          # ./stage0/typelisp compile selfhost/compiler_driver.tl \
          #   -o bootstrap/stage1/compiler.s
          echo "SKIPPED: waiting for #513 (selfhost import resolution)"

      - name: Stage2 — stage1 compiles selfhost
        run: |
          echo "=== Stage1 → Stage2 ==="
          # as bootstrap/stage1/compiler.s -o bootstrap/stage1/compiler.o
          # ld bootstrap/stage1/compiler.o -o bootstrap/stage1/compiler
          # mkdir -p bootstrap/stage2
          # ./bootstrap/stage1/compiler compile selfhost/compiler_driver.tl \
          #   -o bootstrap/stage2/compiler.s
          echo "SKIPPED: waiting for #513"

      - name: Compare stage1 vs stage2
        run: |
          echo "=== Deterministic comparison ==="
          # cmp -s bootstrap/stage1/compiler.s bootstrap/stage2/compiler.s
          echo "SKIPPED: waiting for #513"

      - name: Report
        run: |
          echo "Bootstrap gate: SKIPPED (#513 blocker)"
          echo "Will auto-activate once selfhost can resolve imports."
