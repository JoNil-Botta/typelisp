name: Bootstrap Stage0

# On every merge to main, build release binaries and publish them as permanent
# GitHub releases. A lightweight "stage0-latest" release is recreated with the
# same assets, giving CI a stable download URL while permanent releases remain.

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-linux:
    name: Build Stage0 (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Stage binary
        run: |
          cp target/release/typelisp typelisp-stage0-linux
          strip typelisp-stage0-linux
          file typelisp-stage0-linux
          ls -lh typelisp-stage0-linux

      - name: Stage bundled Linux stage0
        run: scripts/stage-linux-stage0-bundle.sh target/release/typelisp typelisp-stage0-linux-bundle.tar.gz

      - name: Upload stage0 artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage0-linux
          path: |
            typelisp-stage0-linux
            typelisp-stage0-linux-bundle.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Stage0 (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Stage binary
        shell: pwsh
        run: |
          Copy-Item .\target\release\typelisp.exe .\typelisp-stage0-windows.exe
          Get-Item .\typelisp-stage0-windows.exe

      - name: Upload stage0 artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage0-windows
          path: typelisp-stage0-windows.exe
          if-no-files-found: error

  publish:
    name: Publish Stage0 Releases
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
    steps:
      - uses: actions/checkout@v4

      - name: Download stage0 artifacts
        uses: actions/download-artifact@v4
        with:
          path: stage0-artifacts
          merge-multiple: true

      - name: Verify staged assets
        run: |
          test -s stage0-artifacts/typelisp-stage0-linux
          test -s stage0-artifacts/typelisp-stage0-linux-bundle.tar.gz
          test -s stage0-artifacts/typelisp-stage0-windows.exe
          chmod +x stage0-artifacts/typelisp-stage0-linux
          (
            cd stage0-artifacts
            sha256sum typelisp-stage0-linux typelisp-stage0-linux-bundle.tar.gz typelisp-stage0-windows.exe > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          file stage0-artifacts/typelisp-stage0-linux
          ls -lh stage0-artifacts

      - name: Create permanent release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="stage0-$(date -u +%Y%m%d-%H%M%S)-r${{ github.run_id }}"
          notes="$(cat <<EOF
          Bootstrap compiler built from commit ${{ github.sha }}.

          Assets:
          - typelisp-stage0-linux
          - typelisp-stage0-linux-bundle.tar.gz
          - typelisp-stage0-windows.exe
          - SHA256SUMS
          EOF
          )"

          gh release create "$tag" \
            --title "Stage0 $tag" \
            --notes "$notes" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.sha }}" \
            stage0-artifacts/typelisp-stage0-linux \
            stage0-artifacts/typelisp-stage0-linux-bundle.tar.gz \
            stage0-artifacts/typelisp-stage0-windows.exe \
            stage0-artifacts/SHA256SUMS

          echo "PERMANENT_TAG=$tag" >> "$GITHUB_ENV"

      - name: Update latest convenience release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Multiple main pushes can publish concurrently; only the current
          # origin/main commit may move the mutable stage0-latest release.
          git fetch --no-tags --depth=1 origin main
          latest_main="$(git rev-parse refs/remotes/origin/main)"
          if [ "$latest_main" != "${{ github.sha }}" ]; then
            echo "Skipping stage0-latest update for ${{ github.sha }} because origin/main is now $latest_main."
            exit 0
          fi

          gh release delete stage0-latest --yes \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          git push origin :refs/tags/stage0-latest 2>/dev/null || true

          notes="$(cat <<EOF
          Latest bootstrap compiler built from commit ${{ github.sha }}.

          Permanent copy: $PERMANENT_TAG

          Stable asset URLs:
          - https://github.com/${{ github.repository }}/releases/download/stage0-latest/typelisp-stage0-linux
          - https://github.com/${{ github.repository }}/releases/download/stage0-latest/typelisp-stage0-linux-bundle.tar.gz
          - https://github.com/${{ github.repository }}/releases/download/stage0-latest/typelisp-stage0-windows.exe
          - https://github.com/${{ github.repository }}/releases/download/stage0-latest/SHA256SUMS
          EOF
          )"

          gh release create stage0-latest \
            --title "Stage0 latest" \
            --notes "$notes" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.sha }}" \
            stage0-artifacts/typelisp-stage0-linux \
            stage0-artifacts/typelisp-stage0-linux-bundle.tar.gz \
            stage0-artifacts/typelisp-stage0-windows.exe \
            stage0-artifacts/SHA256SUMS
