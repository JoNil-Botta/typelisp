name: Bootstrap Stage0

# On every merge to main, rebuild the self-hosted single-binary stage0 compiler
# (cli.tl) and publish it as permanent GitHub releases. A lightweight
# "stage0-latest" release is replaced from a fully uploaded draft candidate,
# giving CI a stable download URL while permanent releases remain.
#
# The publish job also packages the VS Code extension (tools/vs-code-extension)
# into typelisp.vsix and attaches it to the same releases under a stable asset
# name. The editor plugin therefore installs from the same stable stage0-latest
# URL as the compiler it auto-downloads at runtime.
#
# Self-perpetuation: the new
# stage0 is built by FETCHING THE PREVIOUSLY PUBLISHED stage0 (the last cli.tl
# binary, via scripts/fetch-stage0.sh) and using THAT compiler to compile
# src/main.tl to assembly, then assembling + linking it into the next stage0
# binary. Each published stage0 thus builds its successor.
#
# IMPORTANT: bootstrap uses `compile` (frontend + backend -> .s) and the host
# toolchain (as/ld on Linux; clang + MSVC link.exe on Windows) to assemble and
# link the binary, the same flow as scripts/check-bootstrap-fixpoint.sh. Keeping
# bootstrap on this explicit path avoids making stage0 self-reproduction depend
# on its own `build` command.
#
# The stage0 is a SINGLE cli.tl binary per OS: cli.tl is the unified toolchain
# (compile/build/run/check/fmt/lint/test/doc + the bare-file bootstrap form). It
# finds stdlib via --stdlib-root against the repo checkout until the stdlib is
# embedded into the binary.

on:
  push:
    branches: [main]
  # Reproduce publication build/smoke/fixpoint on the exact PR candidate when
  # its payload decoder or publication checks change. Publication stays push-only.
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-stage0.yml'
      - 'scripts/*stage0*.sh'
      - 'scripts/build-stdlib-sysroot.sh'
      - 'scripts/lib-build-provenance.sh'
      - 'tools/build-stdlib-sysroot/**'
      - 'src/compiler_build_identity.tl'
      - 'src/compiler_ctfe.tl'
      - 'src/compiler_lzss.tl'
      - 'src/compiler_load.tl'
      - 'src/compiler_embedded_stdlib*'
      - 'src/compiler_x64_executable_template_catalog*'

permissions:
  contents: read

concurrency:
  group: stage0-bootstrap-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-linux:
    name: Build Stage0 (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check native toolchain
        run: |
          command -v as
          command -v ld

      - name: Fetch previously published stage0 (seed)
        run: scripts/fetch-stage0.sh

      - name: Build the new stage0 binary from the previous stage0
        run: |
          scripts/build-stage0.sh target/stage0/typelisp typelisp-stage0-linux
          cp lib/x86_64-unknown-linux-gnu/stdlib.tli typelisp-stdlib-x86_64-unknown-linux-gnu.tli
          cp lib/x86_64-unknown-linux-gnu/libstdlib.a libstdlib-x86_64-unknown-linux-gnu.a
          file typelisp-stage0-linux
          ls -lh typelisp-stage0-linux typelisp-stdlib-x86_64-unknown-linux-gnu.tli libstdlib-x86_64-unknown-linux-gnu.a

      - name: Smoke-check the new stage0 binary
        run: |
          ./typelisp-stage0-linux compile src/main.tl -o /tmp/stage0-smoke.s \
            --target linux-x86_64 --stdlib-root stdlib --stdlib-root src
          test -s /tmp/stage0-smoke.s
          scripts/verify-stage0-smoke.sh "$PWD/typelisp-stage0-linux"

      - name: Fixpoint-verify the new stage0 self-reproduces
        run: scripts/check-bootstrap-fixpoint.sh "$PWD/typelisp-stage0-linux"

      - name: Corpus-check the new stage0
        run: |
          for module in stdlib/io.tl stdlib/string.tl stdlib/fs.tl stdlib/env.tl; do
            ./typelisp-stage0-linux check "$module" --stdlib-root stdlib
          done

      - name: Upload stage0 artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage0-linux
          path: |
            typelisp-stage0-linux
            typelisp-stdlib-x86_64-unknown-linux-gnu.tli
            libstdlib-x86_64-unknown-linux-gnu.a
          if-no-files-found: error

  build-windows:
    name: Build Stage0 (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch previously published stage0 (seed)
        shell: bash
        run: scripts/fetch-stage0.sh

      - name: Build the new stage0 binary from the previous stage0
        shell: bash
        run: |
          # build-stage0.sh discovers clang + MSVC link.exe + the Windows SDK the
          # same way the bootstrap fixpoint gate does (scripts/lib-native-link.sh).
          scripts/build-stage0.sh target/stage0/typelisp.exe typelisp-stage0-windows.exe
          cp lib/x86_64-pc-windows-msvc/stdlib.tli typelisp-stdlib-x86_64-pc-windows-msvc.tli
          cp lib/x86_64-pc-windows-msvc/libstdlib.a libstdlib-x86_64-pc-windows-msvc.a
          ls -l typelisp-stage0-windows.exe typelisp-stdlib-x86_64-pc-windows-msvc.tli libstdlib-x86_64-pc-windows-msvc.a

      - name: Smoke-check the new stage0 binary
        shell: bash
        run: |
          ./typelisp-stage0-windows.exe compile src/main.tl -o /tmp/stage0-smoke.s \
            --target windows-x86_64 --cfg windows --cfg target-windows --cfg os-windows \
            --stdlib-root stdlib --stdlib-root src
          test -s /tmp/stage0-smoke.s
          scripts/verify-stage0-smoke.sh "$PWD/typelisp-stage0-windows.exe"

      - name: Fixpoint-verify the new stage0 self-reproduces
        shell: bash
        run: scripts/check-bootstrap-fixpoint.sh "$PWD/typelisp-stage0-windows.exe"

      # Keep this narrow post-merge gate on the converged Windows compiler:
      # verify-compile-profile owns every exact profile-counter pin, including
      # the Windows-only selfhost pool boundaries. PR CI runs the same verifier,
      # but this main-push run attributes a stale pin to the merge that moved it
      # instead of to the next unrelated PR (#5773).
      - name: Verify post-merge exact compile-profile counters
        shell: bash
        run: |
          TYPELISP_BIN="$PWD/typelisp-stage0-windows.exe" \
            scripts/verify-compile-profile.sh

      - name: Corpus-check the new stage0 (frontend only)
        shell: bash
        run: |
          for module in stdlib/io.tl stdlib/string.tl stdlib/fs.tl stdlib/env.tl src/main.tl; do
            ./typelisp-stage0-windows.exe check "$module" --stdlib-root stdlib --stdlib-root src
          done

      - name: Upload stage0 artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage0-windows
          path: |
            typelisp-stage0-windows.exe
            typelisp-stdlib-x86_64-pc-windows-msvc.tli
            libstdlib-x86_64-pc-windows-msvc.a
          if-no-files-found: error

  publish:
    name: Publish Stage0 Releases
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    needs:
      - build-linux
      - build-windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/vs-code-extension/package-lock.json

      - name: Download stage0 artifacts
        uses: actions/download-artifact@v4
        with:
          path: stage0-artifacts
          merge-multiple: true

      - name: Package VS Code extension
        working-directory: tools/vs-code-extension
        run: |
          npm ci
          # Emit a stable asset name (typelisp.vsix) so the download URL is fixed
          # across extension version bumps, like the stage0 binary asset names.
          # `vsce package` runs the vscode:prepublish (compile) script first.
          npx --no-install vsce package --out "$GITHUB_WORKSPACE/stage0-artifacts/typelisp.vsix"

      - name: Verify staged assets
        run: |
          test -s stage0-artifacts/typelisp-stage0-linux
          test -s stage0-artifacts/typelisp-stage0-windows.exe
          test -s stage0-artifacts/typelisp-stdlib-x86_64-unknown-linux-gnu.tli
          test -s stage0-artifacts/libstdlib-x86_64-unknown-linux-gnu.a
          test -s stage0-artifacts/typelisp-stdlib-x86_64-pc-windows-msvc.tli
          test -s stage0-artifacts/libstdlib-x86_64-pc-windows-msvc.a
          test -s stage0-artifacts/typelisp.vsix
          chmod +x stage0-artifacts/typelisp-stage0-linux
          (
            cd stage0-artifacts
            sha256sum \
              typelisp-stage0-linux \
              typelisp-stage0-windows.exe \
              typelisp-stdlib-x86_64-unknown-linux-gnu.tli \
              libstdlib-x86_64-unknown-linux-gnu.a \
              typelisp-stdlib-x86_64-pc-windows-msvc.tli \
              libstdlib-x86_64-pc-windows-msvc.a \
              typelisp.vsix > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          file stage0-artifacts/typelisp-stage0-linux
          ls -lh stage0-artifacts

      - name: Create permanent release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="$(cat <<EOF
          Self-hosted cli.tl stage0 compiler built from commit ${{ github.sha }}.

          Assets:
          - typelisp-stage0-linux
          - typelisp-stage0-windows.exe
          - typelisp-stdlib-x86_64-unknown-linux-gnu.tli
          - libstdlib-x86_64-unknown-linux-gnu.a
          - typelisp-stdlib-x86_64-pc-windows-msvc.tli
          - libstdlib-x86_64-pc-windows-msvc.a
          - typelisp.vsix (VS Code extension)
          - SHA256SUMS
          EOF
          )"

          used_tags=""
          tag=""
          next_tag() {
            local candidate
            while :; do
              candidate="stage0-$(date -u +%Y%m%d-%H%M%S)-r${{ github.run_id }}"
              case " $used_tags " in
                *" $candidate "*) sleep 1 ;;
                *)
                  used_tags="$used_tags $candidate"
                  tag="$candidate"
                  return 0
                  ;;
              esac
            done
          }

          resolve_draft_id() {
            local target_tag="$1"
            local target_url="$2"
            local page_json ids count
            page_json=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100&page=1") || return 1
            ids=$(printf '%s' "$page_json" |
              jq -r --arg tag "$target_tag" --arg url "$target_url" '
                .[] | select(.tag_name == $tag and .draft == true and ($url == "" or .html_url == $url)) | .id
              ') || return 1
            if [ -z "$ids" ]; then
              return 1
            fi
            count=$(printf '%s\n' "$ids" | wc -l | tr -d ' ')
            if [ "$count" -ne 1 ]; then
              echo "[stage0] expected single draft release ID for $target_tag, got: $ids" >&2
              return 1
            fi
            case "$ids" in
              "" | *[!0-9]*)
                echo "[stage0] invalid draft release ID for $target_tag: $ids" >&2
                return 1
                ;;
            esac
            printf '%s\n' "$ids"
          }

          cleanup_partial_draft() {
            local target_tag="$1"
            local target_rid="${2:-}"
            local draft_ids did
            if [ -n "$target_rid" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$target_rid" --silent 2>/dev/null || true
            fi
            gh release delete "$target_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --yes \
              --cleanup-tag 2>/dev/null || true
            draft_ids=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100&page=1" |
              jq -r --arg tag "$target_tag" '.[] | select(.tag_name == $tag and .draft == true) | .id' 2>/dev/null || true)
            for did in $draft_ids; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$did" --silent 2>/dev/null || true
            done
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$target_tag" --silent 2>/dev/null || true
          }

          max_attempts=3
          attempt=1
          rid=""
          while [ "$attempt" -le "$max_attempts" ]; do
            next_tag
            if draft_url=$(gh release create "$tag" \
              --draft \
              --title "Stage0 $tag" \
              --notes "$notes" \
              --repo "$GITHUB_REPOSITORY" \
              --target "${{ github.sha }}" \
              stage0-artifacts/typelisp-stage0-linux \
              stage0-artifacts/typelisp-stage0-windows.exe \
              stage0-artifacts/typelisp-stdlib-x86_64-unknown-linux-gnu.tli \
              stage0-artifacts/libstdlib-x86_64-unknown-linux-gnu.a \
              stage0-artifacts/typelisp-stdlib-x86_64-pc-windows-msvc.tli \
              stage0-artifacts/libstdlib-x86_64-pc-windows-msvc.a \
              stage0-artifacts/typelisp.vsix \
              stage0-artifacts/SHA256SUMS); then
              draft_url=$(printf '%s\n' "$draft_url" | tail -n 1 | tr -d '\r')
              lookup_attempt=1
              while [ "$lookup_attempt" -le 3 ]; do
                if rid=$(resolve_draft_id "$tag" "$draft_url"); then
                  break
                fi
                if [ "$lookup_attempt" -lt 3 ]; then
                  sleep 2
                fi
                lookup_attempt=$((lookup_attempt + 1))
              done
              if [ -n "$rid" ]; then
                echo "[stage0] created draft permanent release $tag (id $rid, $draft_url)"
                break
              fi
              echo "[stage0] created draft permanent release $tag ($draft_url) but could not resolve unique draft ID from page 1 (attempt $attempt/$max_attempts); cleaning partial draft" >&2
            else
              echo "[stage0] draft permanent release creation failed for $tag (attempt $attempt/$max_attempts); cleaning partial draft" >&2
            fi
            cleanup_partial_draft "$tag"
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep $((attempt * 5))
            fi
            attempt=$((attempt + 1))
          done
          if [ -z "$rid" ]; then
            echo "[stage0] failed to create draft permanent release after $max_attempts attempts (last tag: $tag)" >&2
            exit 1
          fi

          attempt=1
          published=false
          while [ "$attempt" -le "$max_attempts" ]; do
            if patched_draft=$(gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$rid" \
              -F draft=false \
              --jq '.draft') && [ "$patched_draft" = false ]; then
              published=true
              break
            fi
            echo "[stage0] publishing permanent release $tag (id $rid) failed (attempt $attempt/$max_attempts)" >&2
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep $((attempt * 5))
            fi
            attempt=$((attempt + 1))
          done
          if [ "$published" != true ]; then
            echo "[stage0] failed to publish permanent release $tag (id $rid) after $max_attempts attempts; cleaning draft" >&2
            cleanup_partial_draft "$tag" "$rid"
            exit 1
          fi

          echo "PERMANENT_TAG=$tag" >> "$GITHUB_ENV"

      - name: Update latest convenience release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes_file="$RUNNER_TEMP/stage0-latest-notes.md"
          cat > "$notes_file" <<EOF
          Latest self-hosted cli.tl stage0 compiler built from commit ${{ github.sha }}.

          Permanent copy: $PERMANENT_TAG

          Stable asset URLs:
          - https://github.com/${{ github.repository }}/releases/download/stage0-latest/typelisp-stage0-linux
          - https://github.com/${{ github.repository }}/releases/download/stage0-latest/typelisp-stage0-windows.exe
          - https://github.com/${{ github.repository }}/releases/download/stage0-latest/typelisp-stdlib-x86_64-unknown-linux-gnu.tli
          - https://github.com/${{ github.repository }}/releases/download/stage0-latest/libstdlib-x86_64-unknown-linux-gnu.a
          - https://github.com/${{ github.repository }}/releases/download/stage0-latest/typelisp-stdlib-x86_64-pc-windows-msvc.tli
          - https://github.com/${{ github.repository }}/releases/download/stage0-latest/libstdlib-x86_64-pc-windows-msvc.a
          - https://github.com/${{ github.repository }}/releases/download/stage0-latest/typelisp.vsix
          - https://github.com/${{ github.repository }}/releases/download/stage0-latest/SHA256SUMS
          EOF

          # Upload the complete replacement as an explicit draft. The helper
          # rechecks the candidate immediately before a short release/tag
          # cutover and promotes the prepared release with one authoritative
          # REST PATCH. The alias only moves forward along main: a candidate
          # still on main and newer than the current alias is promoted even
          # when main has advanced (#8055); a superseded one discards only its
          # private candidate.
          candidate_tag="stage0-candidate-${{ github.run_id }}-${{ github.run_attempt }}"
          set +e
          scripts/publish-stage0-latest.sh \
            "$GITHUB_REPOSITORY" \
            "${{ github.sha }}" \
            "$candidate_tag" \
            "$notes_file" \
            stage0-artifacts/typelisp-stage0-linux \
            stage0-artifacts/typelisp-stage0-windows.exe \
            stage0-artifacts/typelisp-stdlib-x86_64-unknown-linux-gnu.tli \
            stage0-artifacts/libstdlib-x86_64-unknown-linux-gnu.a \
            stage0-artifacts/typelisp-stdlib-x86_64-pc-windows-msvc.tli \
            stage0-artifacts/libstdlib-x86_64-pc-windows-msvc.a \
            stage0-artifacts/typelisp.vsix \
            stage0-artifacts/SHA256SUMS
          publish_status=$?
          set -e
          if [ "$publish_status" -eq 3 ]; then
            echo "Skipping stage0-latest verification because this candidate was not promoted (no longer on main, or stage0-latest already targets it or a newer commit)."
            exit 0
          fi
          if [ "$publish_status" -ne 0 ]; then
            exit "$publish_status"
          fi

          scripts/verify-stage0-release.sh \
            "$GITHUB_REPOSITORY" \
            stage0-latest \
            "${{ github.sha }}" \
            typelisp-stage0-linux \
            typelisp-stage0-windows.exe \
            typelisp-stdlib-x86_64-unknown-linux-gnu.tli \
            libstdlib-x86_64-unknown-linux-gnu.a \
            typelisp-stdlib-x86_64-pc-windows-msvc.tli \
            libstdlib-x86_64-pc-windows-msvc.a \
            typelisp.vsix \
            SHA256SUMS
