name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # TypeLisp is self-hosted. The single verification flow fetches the published
  # stage0 (cli.tl), runs the one compiler build of the flow (the
  # stage1->stage2->stage3 bootstrap fixpoint over src/main.tl), and then
  # runs every gate on the resulting stage2 compiler.
  # The gate is fail-closed: Linux and Windows must run every applicable gate.
  # Do not add skip flags; compiler/runtime capability changes should land first,
  # then a follow-up PR can use the new capability.
  ci:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Test + Integration
            os: ubuntu-latest
            timeout_minutes: 120
          - name: Test + Integration (windows-latest)
            os: windows-latest
            timeout_minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Check implementation language allowlist
        shell: bash
        run: scripts/check-implementation-languages.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/vs-code-extension/package-lock.json

      - name: VS Code extension smoke
        shell: bash
        working-directory: tools/vs-code-extension
        run: |
          npm ci
          npm run check
          npm run package

      - name: Check native toolchain
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              command -v as
              command -v ld
              ;;
            Windows)
              command -v clang
              command -v lld-link || command -v lld-link.exe
              ;;
            *)
              echo "unsupported runner OS: $RUNNER_OS" >&2
              exit 1
              ;;
          esac

      - name: Install Linux instruction-count tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # cachegrind only needs valgrind itself; skipping Recommends drops the
          # gdb + libc6-dbg + source-highlight tree that dominated install time.
          # Install against the runner's preinstalled apt index first, and only
          # refresh it (apt-get update) if a stale index 404s on a package.
          sudo apt-get install -y --no-install-recommends valgrind \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind; }

      - name: CI verification
        shell: bash
        run: scripts/ci-verify.sh
