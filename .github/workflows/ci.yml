name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # TEMPORARY DEBUG WORKFLOW (debug-2357-ci) v3: the manifest gate passes in
  # isolation but dies ~2 min in during the real pipeline, at times that
  # correlate with wall-clock rather than chunk contents. Run the real
  # ci-verify pipeline with a background process/memory sampler to catch a
  # runaway process leaked by an earlier gate.
  debug:
    name: Debug pipeline memory (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Start process sampler
        shell: powershell
        run: |
          $script = @'
          while ($true) {
            $ts = Get-Date -Format o
            $os = Get-CimInstance Win32_OperatingSystem
            "=== $ts freeMB=$([math]::Round($os.FreePhysicalMemory/1024)) commitMB=$([math]::Round((Get-Counter '\Memory\Committed Bytes').CounterSamples[0].CookedValue/1MB))" | Out-File -Append -Encoding ascii C:\sampler.log
            Get-Process | Where-Object { $_.PrivateMemorySize64 -gt 200MB } | Sort-Object PrivateMemorySize64 -Descending | Select-Object -First 8 Name,Id,@{n='privMB';e={[math]::Round($_.PrivateMemorySize64/1MB)}},@{n='cpu';e={$_.CPU}} | Format-Table | Out-String | Out-File -Append -Encoding ascii C:\sampler.log
            Start-Sleep -Seconds 15
          }
          '@
          Set-Content -Path C:\sampler.ps1 -Value $script -Encoding ascii
          Start-Process powershell -ArgumentList @("-ExecutionPolicy","Bypass","-File","C:\sampler.ps1") -WindowStyle Hidden

      - name: Check implementation language allowlist
        shell: bash
        run: scripts/check-implementation-languages.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/vs-code-extension/package-lock.json

      - name: VS Code extension smoke
        shell: bash
        working-directory: tools/vs-code-extension
        run: |
          npm ci
          npm run check
          npm run package

      - name: Check native toolchain
        shell: bash
        run: |
          command -v clang
          command -v lld-link || command -v lld-link.exe

      - name: CI verification
        shell: bash
        run: scripts/ci-verify.sh

      - name: Upload sampler log
        if: always()
        shell: bash
        run: cp /c/sampler.log sampler.log 2>/dev/null || true

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-2357-windows-v3
          path: |
            sampler.log
          if-no-files-found: warn
