name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # TEMPORARY DEBUG WORKFLOW (debug-2357-ci): reproduce the Windows-only
  # SIGSEGV when the build-stage0.sh-built stage1 compiles
  # selfhost/build_run_core.tl. Uploads the binary and assembly as artifacts.
  debug:
    name: Debug build_run_core crash (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain and CPU info
        shell: bash
        run: |
          clang --version || true
          command -v lld-link && lld-link --version || true
          command -v link && link 2>&1 | head -2 || true
          powershell -Command "Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores | Format-List" || true
          powershell -Command "Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,TotalVisibleMemorySize,FreePhysicalMemory | Format-List" || true

      - name: Fetch stage0
        shell: bash
        run: |
          scripts/fetch-stage0.sh
          sha256sum target/stage0/typelisp.exe

      - name: Build stage1 via build-stage0.sh
        shell: bash
        run: |
          scripts/build-stage0.sh target/stage0/typelisp.exe target/debug-stage1.exe
          sha256sum target/debug-stage1.exe
          sha256sum target/build-stage0/cli.s

      - name: Compile build_run_core solo
        shell: bash
        run: |
          set +e
          target/debug-stage1.exe compile selfhost/build_run_core.tl -o target/brc.s --stdlib-root "$PWD/stdlib" > target/brc.out 2> target/brc.err
          code=$?
          echo "exit=$code"
          echo "--- stdout"; cat target/brc.out
          echo "--- stderr"; cat target/brc.err
          if [ "$code" -ne 0 ]; then
            echo "CRASH reproduced with exit $code"
          fi
          # also try the other heavy drivers for scope
          for f in selfhost/cli.tl selfhost/check.tl selfhost/compile.tl; do
            target/debug-stage1.exe compile "$f" -o "target/$(basename "$f").s" --stdlib-root "$PWD/stdlib" > /dev/null 2>&1
            echo "$f exit=$?"
          done
          exit 0

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-2357-windows
          path: |
            target/debug-stage1.exe
            target/build-stage0/cli.s
            target/brc.out
            target/brc.err
          if-no-files-found: warn
