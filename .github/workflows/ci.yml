name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # TEMPORARY DEBUG WORKFLOW (debug-2357-ci) v2: solo compiles pass on the
  # runner, so reproduce the SIGSEGV through the real manifest gate with WER
  # crash dumps enabled, and upload the dump + binary for offline analysis.
  debug:
    name: Debug manifest gate crash (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable WER local crash dumps
        shell: powershell
        run: |
          New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" -Name DumpFolder -Value "C:\dumps" -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" -Name DumpCount -Value 5 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" -Name DumpType -Value 2 -PropertyType DWord -Force | Out-Null
          New-Item -ItemType Directory -Force C:\dumps | Out-Null

      - name: Fetch stage0
        shell: bash
        run: scripts/fetch-stage0.sh

      - name: Build stage1 via build-stage0.sh
        shell: bash
        run: |
          scripts/build-stage0.sh target/stage0/typelisp.exe target/debug-stage1.exe
          sha256sum target/debug-stage1.exe

      - name: Run manifest gate (per-file chunks)
        shell: bash
        run: |
          set +e
          TYPELISP_BIN="$PWD/target/debug-stage1.exe" \
          TYPELISP_COMPILE_MANIFEST_EXPECTATION_MODE=stage1 \
          TYPELISP_COMPILE_MANIFEST_BATCH_SIZE=1 \
            scripts/verify-selfhost-compile-manifest.sh
          code=$?
          echo "gate exit=$code"
          ls -la C:/dumps 2>/dev/null || true
          exit 0

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-2357-windows-v2
          path: |
            target/debug-stage1.exe
            C:\dumps\*.dmp
            target/selfhost-compile-manifest/compile-batch-chunks/*.err
            target/selfhost-compile-manifest/compile-batch-chunks/*.out
          if-no-files-found: warn
