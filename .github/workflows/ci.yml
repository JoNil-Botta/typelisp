name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --verbose

      - name: Check native toolchain
        run: |
          command -v as
          command -v ld

      - name: Run tests
        run: cargo test --verbose

      - name: Check deterministic assembly output
        run: scripts/check-deterministic-asm.sh

      - name: Test frontend CLI commands
        run: |
          cargo run --quiet -- tokenize examples/hello.tl
          cargo run --quiet -- parse examples/hello.tl
          cargo run --quiet -- check examples/hello.tl
          cargo run --quiet -- compile tests/integration/factorial.tl -o target/ci-frontend-smoke.s

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Verify zero dependencies
        run: |
          if grep -qE '^\[dependencies\]|^\[dev-dependencies\]' Cargo.toml; then
            echo "ERROR: Cargo.toml contains dependencies. TypeLisp must have zero third-party crates."
            exit 1
          fi
          echo "OK: No third-party dependencies found."

  test-windows:
    name: Test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Test frontend CLI commands
        run: |
          cargo run --quiet -- tokenize examples/hello.tl
          cargo run --quiet -- parse examples/hello.tl
          cargo run --quiet -- check examples/hello.tl
          cargo run --quiet -- compile tests/integration/factorial.tl -o target/ci-frontend-smoke.s

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release

      - name: Test CLI commands
        run: |
          mkdir -p test_programs
          echo '(define x : i64 42)' > test_programs/basic.tl
          ./target/release/typelisp tokenize test_programs/basic.tl
          ./target/release/typelisp parse test_programs/basic.tl
          ./target/release/typelisp check test_programs/basic.tl

      - name: Test type checker
        run: |
          cat > test_programs/factorial.tl << 'EOF'
          (define (factorial [n : i64]) : i64
            (if (= n 0)
                1
                (* n (factorial (- n 1)))))
          EOF
          ./target/release/typelisp check test_programs/factorial.tl

      - name: Test type error detection
        run: |
          cat > test_programs/bad.tl << 'EOF'
          (define (bad [a : i64] [b : bool]) : i64 (+ a b))
          EOF
          if ./target/release/typelisp check test_programs/bad.tl; then
            echo "Expected type error but got success"
            exit 1
          fi
          echo "Correctly detected type error"
