name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # TypeLisp is self-hosted: there is no Rust compiler to build. The single
  # verification flow fetches the published self-hosted stage0 (cli.tl) and runs
  # every gate through it (and, on Linux, through a freshly bootstrapped stage1).
  # The gate stays cross-platform; individual scripts may skip explicitly
  # documented Linux-only or Windows-blocked coverage.
  ci:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Test + Integration
            os: ubuntu-latest
            timeout_minutes: 120
          - name: Test + Integration (windows-latest)
            os: windows-latest
            timeout_minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Check implementation language allowlist
        shell: bash
        run: scripts/check-implementation-languages.sh

      - name: Check native toolchain
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          command -v as
          command -v ld

      - name: Stage0 verification
        shell: bash
        run: scripts/verify-no-rust-stage0.sh
