name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # TypeLisp is self-hosted: there is no Rust compiler to build. The single
  # verification flow fetches the published self-hosted stage0 (cli.tl) and runs
  # every gate through it (and, on Linux, through a freshly bootstrapped stage1).
  # The gate stays cross-platform; individual scripts may skip explicitly
  # documented Linux-only or Windows-blocked coverage.
  ci:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Stage0 Verification (linux)
            os: ubuntu-latest
            timeout_minutes: 35
          - name: Stage0 Verification (windows-latest)
            os: windows-latest
            timeout_minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check implementation language allowlist
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: scripts/check-implementation-languages.sh

      - name: Check native toolchain
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          command -v as
          command -v ld

      - name: Run self-hosted stage0 verification gate
        shell: bash
        run: scripts/verify-no-rust-stage0.sh
