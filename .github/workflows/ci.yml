name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # TypeLisp is self-hosted. The single verification flow fetches the published
  # stage0 (cli.tl), runs the one compiler build of the flow (the
  # stage1->stage2->stage3 bootstrap fixpoint over src/main.tl, with a stage4
  # fallback when needed), and then runs every gate on the converged compiler.
  # The gate is fail-closed: Linux and Windows must run every applicable gate.
  # Do not add skip flags; compiler/runtime capability changes should land first,
  # then a follow-up PR can use the new capability.
  ci:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Test + Integration
            os: ubuntu-latest
            timeout_minutes: 120
          - name: Test + Integration (windows-latest)
            os: windows-latest
            timeout_minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Check implementation language allowlist
        shell: bash
        run: scripts/check-implementation-languages.sh

      - name: Check .gitignore covers toolchain output
        shell: bash
        run: scripts/check-gitignore.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/vs-code-extension/package-lock.json

      - name: VS Code extension smoke
        shell: bash
        working-directory: tools/vs-code-extension
        run: |
          npm ci
          npm run check
          npm run package

      - name: Check native toolchain
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              command -v as
              command -v ld
              ;;
            Windows)
              command -v clang
              command -v lld-link || command -v lld-link.exe
              ;;
            *)
              echo "unsupported runner OS: $RUNNER_OS" >&2
              exit 1
              ;;
          esac

      - name: Install Linux instruction-count tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # cachegrind only needs valgrind itself; skipping Recommends drops the
          # gdb + libc6-dbg + source-highlight tree that dominated install time.
          # Install against the runner's preinstalled apt index first, and only
          # refresh it (apt-get update) if a stale index 404s on a package.
          sudo apt-get install -y --no-install-recommends valgrind \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind; }

      - name: Add Linux swap headroom
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Large selfhost inline-test harnesses can exceed physical runner RAM
          # while still passing locally and with full coverage; add swap instead
          # of weakening the required CI gates.
          sudo fallocate -l 8G /typelisp-swap
          sudo chmod 600 /typelisp-swap
          sudo mkswap /typelisp-swap
          sudo swapon /typelisp-swap
          free -h

      - name: CI verification
        shell: bash
        env:
          TYPELISP_CI_TIMING: '1'
          TYPELISP_CI_COMPILER_ARTIFACT_TRACE: target/ci-compiler-artifacts/trace.tsv
        run: scripts/ci-verify.sh

      - name: Enforce Linux CI timing budgets
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/check-ci-timing-budgets.sh target/ci-timing/linux.tsv

      - name: Upload CI timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-${{ runner.os }}
          path: target/ci-timing/*.tsv
          if-no-files-found: error

      - name: Upload CI compiler artifact inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-compiler-artifacts-${{ runner.os }}
          path: target/ci-compiler-artifacts/*.tsv
          if-no-files-found: error

      - name: Upload TLCI native route stress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlci-native-route-stress-${{ runner.os }}
          path: target/tlci-native-route-stress/**
          if-no-files-found: warn

      - name: Upload embedded stdlib TLCI resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embedded-stdlib-tlci-resources-${{ runner.os }}
          path: |
            target/embedded-stdlib-tlci-resources/*/*.tsv
            target/embedded-stdlib-tlci-resources/*/reproduce.txt
            target/embedded-stdlib-tlci-resources/*/reports/**
            target/embedded-stdlib-tlci-resources/*/logs/**
            target/embedded-stdlib-tlci-resources/*/*.cachegrind
            target/embedded-stdlib-tlci-resources/*/*.valgrind.log
            target/embedded-stdlib-tlci-resources/*/representative-expansion.tl
            target/embedded-stdlib-tlci-resources/*/native.s
            target/embedded-stdlib-tlci-resources/*/source.s
          if-no-files-found: warn
