name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # TypeLisp is self-hosted: there is no Rust compiler to build. The single
  # verification flow fetches the published self-hosted stage0 (cli.tl) and runs
  # every gate through it (and, on Linux, through a freshly bootstrapped stage1).
  # The gate is fail-closed: Linux and Windows must run every applicable gate.
  # Do not add skip flags; compiler/runtime capability changes should land first,
  # then a follow-up PR can use the new capability.
  ci:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Test + Integration
            os: ubuntu-latest
            timeout_minutes: 120
          - name: Test + Integration (windows-latest)
            os: windows-latest
            timeout_minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Check implementation language allowlist
        shell: bash
        run: scripts/check-implementation-languages.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/vs-code-extension/package-lock.json

      - name: VS Code extension smoke
        shell: bash
        working-directory: tools/vs-code-extension
        run: |
          npm ci
          npm run check
          npm run package

      - name: Check native toolchain
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              command -v as
              command -v ld
              ;;
            Windows)
              command -v clang
              command -v lld-link || command -v lld-link.exe
              ;;
            *)
              echo "unsupported runner OS: $RUNNER_OS" >&2
              exit 1
              ;;
          esac

      - name: CI verification
        shell: bash
        run: scripts/ci-verify.sh
