name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check selfhost contribution guardrail
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          SELFHOST_GUARDRAIL_BASE="origin/${{ github.base_ref }}" scripts/check-selfhost-guardrail.sh

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --verbose

      - name: Check native toolchain
        run: |
          command -v as
          command -v ld

      - name: Verify public tools without Rust harness
        run: TYPELISP_BIN=target/debug/typelisp scripts/verify-public-tools.sh

      - name: Verify selfhost compile manifest without Rust harness
        run: TYPELISP_BIN=target/debug/typelisp scripts/verify-selfhost-compile-manifest.sh

      - name: Run tests
        run: cargo test --verbose

      - name: Check deterministic assembly output
        run: scripts/check-deterministic-asm.sh

      - name: Test frontend CLI commands
        run: |
          cargo run --quiet -- tokenize examples/hello.tl
          cargo run --quiet -- parse examples/hello.tl
          cargo run --quiet -- check examples/hello.tl
          cargo run --quiet -- compile tests/integration/factorial.tl -o target/ci-frontend-smoke.s

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Verify zero dependencies
        run: |
          if grep -qE '^\[dependencies\]|^\[dev-dependencies\]' Cargo.toml; then
            echo "ERROR: Cargo.toml contains dependencies. TypeLisp must have zero third-party crates."
            exit 1
          fi
          echo "OK: No third-party dependencies found."

  test-windows:
    name: Test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --verbose

      - name: Verify public tools without Rust harness
        shell: bash
        run: TYPELISP_BIN=target/debug/typelisp.exe scripts/verify-public-tools.sh

      - name: Verify selfhost compile manifest without Rust harness
        shell: bash
        run: TYPELISP_BIN=target/debug/typelisp.exe scripts/verify-selfhost-compile-manifest.sh

      - name: Run tests
        run: cargo test --verbose

      - name: Check deterministic assembly output
        shell: bash
        run: TYPELISP_BIN=target/debug/typelisp.exe scripts/check-deterministic-asm.sh

      - name: Verify examples (windows-x86_64)
        shell: bash
        run: TYPELISP_BIN=target/debug/typelisp.exe scripts/verify-examples.sh

      - name: Verify stdlib modules (windows-x86_64)
        shell: bash
        run: TYPELISP_BIN=target/debug/typelisp.exe scripts/verify-stdlib.sh

      - name: Test frontend CLI commands
        run: |
          cargo run --quiet -- tokenize examples/hello.tl
          cargo run --quiet -- parse examples/hello.tl
          cargo run --quiet -- check examples/hello.tl
          cargo run --quiet -- compile tests/integration/factorial.tl -o target/ci-frontend-smoke.s

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Verify zero dependencies
        shell: bash
        run: |
          if grep -qE '^\[dependencies\]|^\[dev-dependencies\]' Cargo.toml; then
            echo "ERROR: Cargo.toml contains dependencies. TypeLisp must have zero third-party crates."
            exit 1
          fi
          echo "OK: No third-party dependencies found."

      - name: Check TypeLisp source formatting
        shell: bash
        run: TYPELISP_BIN=target/debug/typelisp.exe scripts/check-tl-format.sh

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release

      - name: Test CLI commands
        run: |
          mkdir -p test_programs
          echo '(define x : i64 42)' > test_programs/basic.tl
          ./target/release/typelisp tokenize test_programs/basic.tl
          ./target/release/typelisp parse test_programs/basic.tl
          ./target/release/typelisp check test_programs/basic.tl

      - name: Test type checker
        run: |
          cat > test_programs/factorial.tl << 'EOF'
          (define (factorial [n : i64]) : i64
            (if (= n 0)
                1
                (* n (factorial (- n 1)))))
          EOF
          ./target/release/typelisp check test_programs/factorial.tl

      - name: Test type error detection
        run: |
          cat > test_programs/bad.tl << 'EOF'
          (define (bad [a : i64] [b : bool]) : i64 (+ a b))
          EOF
          if ./target/release/typelisp check test_programs/bad.tl; then
            echo "Expected type error but got success"
            exit 1
          fi
          echo "Correctly detected type error"

      - name: Verify integration corpus
        run: TYPELISP_BIN=./target/release/typelisp ./scripts/verify-integration.sh

      - name: Compile and verify all examples
        run: TYPELISP_BIN=./target/release/typelisp ./scripts/verify-examples.sh

      - name: Verify stdlib modules
        run: TYPELISP_BIN=./target/release/typelisp ./scripts/verify-stdlib.sh

      - name: Verify stdlib documentation
        run: TYPELISP_BIN=./target/release/typelisp ./scripts/verify-stdlib-docs.sh

      - name: Check TypeLisp source formatting
        run: TYPELISP_BIN=./target/release/typelisp ./scripts/check-tl-format.sh

      - name: Run selfhost verification
        run: TYPELISP_BIN=./target/release/typelisp ./scripts/verify-selfhost.sh

      - name: Run bootstrap fixpoint check
        run: TYPELISP_BIN=./target/release/typelisp ./scripts/check-bootstrap-fixpoint.sh
