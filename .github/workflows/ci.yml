name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# DEBUG #1204 BRANCH: this workflow is temporarily reduced to a Windows-only,
# amplified reproduction of the transient borrowed-str segfault. It builds one
# instrumented compiler and loops the crash-prone workloads (self-compile +
# doctest gate + many per-file invocations) under self-poison until the crash
# surfaces, then uploads the minidump + binary. REVERT this file to the full
# fail-closed gate (Linux + Windows ci-verify) once the root cause is fixed.
jobs:
  repro:
    name: Reproduce #1204 (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Check native toolchain
        shell: bash
        run: |
          command -v clang
          command -v lld-link || command -v lld-link.exe

      - name: Configure crash dumps (WER LocalDumps -> target/dumps)
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE 'target\dumps'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value $dir -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -Value 50 -PropertyType DWord -Force | Out-Null
          Write-Host "WER LocalDumps configured -> $dir (DumpType=1 mini)"

      - name: Amplified #1204 reproduction
        shell: bash
        run: scripts/debug-1204-repro.sh

      - name: Upload crash dumps + binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-1204-debug
          path: |
            target/dumps/**
            target/dbg1204/stage1.s
            target/dbg1204/stage1.obj
            target/dbg1204/stage1.exe
          if-no-files-found: warn
          retention-days: 7
